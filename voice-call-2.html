<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC P2P Chat + Voice — Auto Host/Discovery</title></head><body><div id="loading" style="font-family:system-ui;padding:20px">Loading voice-call-2 with automatic host discovery…</div><script>
(async()=>{try{
const BASE='https://raw.githubusercontent.com/psach/psach.github.io/67727a14a033b85cef5868926e13a1420b388c62/voice-call-2.html';
const r=await fetch(BASE+'?auto='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Base voice-call-2 HTTP '+r.status);let h=await r.text();
const patch=`<script>
(function(){
const CSV='https://docs.google.com/spreadsheets/d/1Ldcjo11fSlrXcGe6FIPB606tCwc7_eTilWEe08J59Dc/export?format=csv';
const WIN=10*60*1000;let busy=false,autoStarted=false;
const $=id=>document.getElementById(id);
const norm=v=>String(v??'').trim().toLowerCase().replace(/\\s+/g,' ');
function csv(t){let a=[],r=[],c='',q=0;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(q){if(x==='"'&&n==='"'){c+='"';i++}else if(x==='"')q=0;else c+=x}else if(x==='"')q=1;else if(x===','){r.push(c);c=''}else if(x==='\\n'){r.push(c);a.push(r);r=[];c=''}else if(x!=='\\r')c+=x}if(c||r.length){r.push(c);a.push(r)}return a}
function col(h,n){for(const x of n){let i=h.indexOf(norm(x));if(i>=0)return i}return -1}
async function hosts(){const z=await fetch(CSV+'&t='+Date.now(),{cache:'no-store'});if(!z.ok)throw Error('Sheet HTTP '+z.status);const rows=csv(await z.text());if(rows.length<2)return[];const h=rows[0].map(norm),ri=col(h,['room']),pi=col(h,['peer']),ti=col(h,['type']),xi=col(h,['payload','payLoad']),tsi=col(h,['timestamp','time']);if([ri,pi,ti,xi].some(x=>x<0))throw Error('Sheet columns not found');const now=Date.now(),out=[];for(let i=1;i<rows.length;i++){let a=rows[i],ty=norm(a[ti]),rm=String(a[ri]||'').trim(),p=String(a[pi]||'').trim(),pl=String(a[xi]||'').trim();if(ty!=='offer'||!rm||!pl)continue;let tm=Date.parse(String((tsi>=0?a[tsi]:a[0])||''));if(tm&&(now-tm>WIN||tm-now>15000))continue;let answered=false;for(let j=i+1;j<rows.length;j++){let q=rows[j];if(norm(q[ti])==='answer'&&norm(q[ri])===norm(rm)&&String(q[pi]||'').trim()!==p&&String(q[xi]||'').trim()){answered=true;break}}if(!answered&&!out.some(o=>norm(o.room)===norm(rm)))out.push({room:rm,peer:p})}return out.reverse()}
function ui(){if($('autoDiscoveryCard'))return;let d=document.createElement('div');d.id='autoDiscoveryCard';d.style.cssText='background:#111a24e8;border:1px solid #2b3a4b;border-radius:16px;padding:14px;margin:12px 0;font-family:system-ui;color:#eef3f8';d.innerHTML='<b>Automatic host discovery</b><div id="autoDiscoveryStatus" style="font-size:12px;color:#9eacba;margin-top:6px">Starting…</div><div id="autoHosts" style="margin-top:8px"></div>';let m=document.querySelector('main');(m||document.body).insertBefore(d,m?m.firstElementChild:document.body.firstChild)}
function status(s){if($('autoDiscoveryStatus'))$('autoDiscoveryStatus').textContent=s;try{log('[Auto] '+s)}catch(e){}}
function show(a){let b=$('autoHosts');if(!b)return;b.innerHTML='';let me=typeof peer==='undefined'?null:peer,a2=a.filter(x=>x.peer!==me);if(!a2.length){b.textContent='No host currently waiting.';return}a2.forEach(x=>{let bt=document.createElement('button');bt.textContent='Join host '+x.room;bt.onclick=async()=>{if(typeof role!=='undefined'&&role)return;$('room').value=x.room;status('Joining '+x.room+'…');await join()};b.appendChild(bt)})}
async function refresh(){if(busy)return;busy=true;try{let a=await hosts();show(a);if(typeof role!=='undefined'&&role){status(role==='host'?'Hosting '+room():'Connected');return}status(a.length?a.length+' host(s) waiting':'No host found; automatic host will start');}catch(e){status('Read error: '+e.message)}finally{busy=false}}
function newRoom(){return 'AUTO-'+Math.random().toString(36).slice(2,8).toUpperCase()}
async function autoHost(){if(autoStarted||typeof role==='undefined'||role||typeof pc==='undefined'||pc)return;autoStarted=true;try{let a=await hosts();show(a);if(a.length){status('Host found; tap Join');autoStarted=false;return}let r=newRoom();$('room').value=r;status('Creating host '+r+'…');await host();status('Hosting '+r)}catch(e){autoStarted=false;status('Auto-host failed: '+e.message);try{addMessage('system','Auto-host failed: '+(e.message||e))}catch(_){}}}
function start(){ui();refresh();setTimeout(autoHost,2500);setInterval(()=>{if(document.visibilityState!=='hidden'){refresh();if(!role&&!pc)autoHost()}},2500)}
window.addEventListener('load',()=>setTimeout(start,300));
})();<\/script>`;
h=h.replace('</body>',patch+'</body>');document.open();document.write(h);document.close();
}catch(e){document.getElementById('loading').textContent='Auto-discovery loader failed: '+e.message}})();
</script></body></html>
