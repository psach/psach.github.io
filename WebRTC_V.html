<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC Voice Call</title><style>body{font-family:system-ui;background:#0a1017;color:#eef3f8;margin:0}main{max-width:900px;margin:auto;padding:16px}.card{background:#111a24;border:1px solid #2b3a4b;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:6px;flex-wrap:wrap}input{padding:10px;border-radius:10px;border:1px solid #36495b;background:#0c141d;color:#eef3f8;width:100%;box-sizing:border-box}button{padding:10px 14px;margin:4px 2px;border-radius:10px;border:1px solid #405369;background:#13202d;color:#eef3f8;cursor:pointer}.muted,.small{color:#9eacba;font-size:12px}.pill{padding:5px 9px;border-radius:20px;background:#1e2b39;font-size:12px}.log{height:220px;overflow:auto;background:#080d13;border:1px solid #263543;border-radius:10px;padding:10px;white-space:pre-wrap}.incoming{border:1px solid #5a7b9c;border-radius:10px;padding:10px;margin-top:8px}</style></head><body><main><div class="card"><h1>WebRTC P2P Voice Call</h1><div class="muted">Google Form/Sheet is used only for initial WebRTC signaling. Call ringing, call control and realtime audio use the established WebRTC connection.</div></div><div class="card"><label>Room</label><input id="room" placeholder="e.g. ABC-123"><div class="small" style="margin-top:8px">Peer: <span class="pill" id="peer">ea867418</span> · State: <span class="pill" id="state">idle</span></div><details style="margin-top:10px"><summary>⚙ Google signaling</summary><label>Form response URL</label><input id="formUrl" readonly><label>Sheet CSV URL</label><input id="csvUrl" readonly></details></div><div class="card"><div class="row"><button onclick="host()">Create / Host</button><button onclick="join()">Join</button><button onclick="disconnect()">Disconnect</button></div></div><div class="card"><h2>Realtime voice</h2><div class="row"><button id="callBtn" onclick="startCall()">📞 Start call</button><button id="acceptBtn" onclick="acceptCall()" disabled>✅ Accept</button><button id="declineBtn" onclick="declineCall()" disabled>❌ Decline</button><button id="muteBtn" onclick="toggleMute()" disabled>🔇 Mute</button><button id="hangupBtn" onclick="hangup()" disabled>☎ Hang up</button><button id="playBtn" onclick="playRemote()" disabled>🔊 Play voice</button></div><div id="voiceState" class="muted">Call idle</div><div id="incomingBox"></div><audio id="remoteAudio" autoplay playsinline></audio></div><div class="card"><h2>WebRTC / ICE</h2><pre id="log" class="log"></pre></div></main><script>
const FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSdEjjnrVdk-FNCTWiZ7nDaPGYdFgg9-7vINoMqoY5ynVA7twA/formResponse",CSV_URL="https://docs.google.com/spreadsheets/d/1Ldcjo11fSlrXcGe6FIPB606tCwc7_eTilWEe08J59Dc/export?format=csv",ENTRY={room:"entry.2110898792",peer:"entry.1013260375",type:"entry.1722712182",payload:"entry.1320930057"},ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]},peer=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()).slice(0,8);let pc=null,dc=null,role="",poller=null,seen=new Set(),localStream=null,remoteStream=new MediaStream(),audioSender=null,callActive=false,incoming=false,ringTimer=null;function $(x){return document.getElementById(x)}function room(){return $("room").value.trim()}function log(x){$("log").textContent+=x+"\n";$("log").scrollTop=$("log").scrollHeight}function setState(x){$("state").textContent=x}
function unlockRemoteAudio(){const a=$("remoteAudio");a.muted=true;a.volume=1;try{const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}setTimeout(()=>{a.muted=false},0);log("Remote audio element primed")}
function stopRing(){if(ringTimer){clearInterval(ringTimer);ringTimer=null}}function startRing(){stopRing();try{const C=window.AudioContext||window.webkitAudioContext;if(!window.__ringCtx)window.__ringCtx=new C();const c=window.__ringCtx;if(c.state==="suspended")c.resume().catch(()=>{});const beep=()=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2)};beep();ringTimer=setInterval(beep,900)}catch(e){log("Ring error: "+e.message)}}
function submit(type,payload){return new Promise(done=>{const n="gf"+Date.now()+Math.random(),i=document.createElement("iframe"),f=document.createElement("form");i.name=n;i.hidden=true;document.body.appendChild(i);f.action=FORM_URL;f.method="POST";f.target=n;[[ENTRY.room,room()],[ENTRY.peer,peer],[ENTRY.type,type],[ENTRY.payload,payload]].forEach(([k,v])=>{const x=document.createElement("input");x.name=k;x.value=v;f.appendChild(x)});document.body.appendChild(f);let finished=false,finish=()=>{if(finished)return;finished=true;setTimeout(()=>{f.remove();i.remove()},300);done()};i.onload=finish;f.submit();setTimeout(finish,1500)})}async function publish(t,p){await submit(t,p);log("Published "+t)}
function parseCSV(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){const x=t[i],n=t[i+1];if(q){if(x==='"'&&n==='"'){c+='"';i++}else if(x==='"')q=false;else c+=x}else if(x==='"')q=true;else if(x===','){r.push(c);c=""}else if(x==='\n'){r.push(c);a.push(r);r=[];c=""}else if(x!=='\r')c+=x}if(c||r.length){r.push(c);a.push(r)}return a}function norm(x){return String(x||"").trim().toLowerCase()}function col(h,n){for(const x of n){const i=h.indexOf(norm(x));if(i>=0)return i}return-1}async function getSignals(){const z=await fetch(CSV_URL+"&t="+Date.now(),{cache:"no-store"});if(!z.ok)throw Error("Sheet HTTP "+z.status);const rows=parseCSV(await z.text()),h=(rows.shift()||[]).map(norm),ri=col(h,["room"]),pi=col(h,["peer"]),ti=col(h,["type"]),xi=col(h,["payload","payLoad"]);if([ri,pi,ti,xi].some(x=>x<0))throw Error("Sheet columns not found");return rows.filter(r=>norm(r[ri])===norm(room())).map(r=>({peer:r[pi]||"",type:r[ti]||"",payload:r[xi]||"",timestamp:r[0]||""}))}function setupDC(c){dc=c;dc.onopen=()=>{log("DataChannel OPEN");setState("connected");stopPolling()};dc.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.kind==="call"){handleCall(m)}}catch(e){}};dc.onclose=()=>log("DataChannel CLOSED")}function sendCall(type){if(!dc||dc.readyState!=="open"){log("DataChannel not open");return false}dc.send(JSON.stringify({kind:"call",type,from:peer,time:Date.now()}));return true}
function createPC(){if(pc)try{pc.close()}catch(e){}pc=new RTCPeerConnection(ICE);const tr=pc.addTransceiver("audio",{direction:"sendrecv"});audioSender=tr.sender;pc.onconnectionstatechange=()=>{setState(pc.connectionState);log("Connection: "+pc.connectionState);if(pc.connectionState==="connected")stopPolling()};pc.oniceconnectionstatechange=()=>log("ICE: "+pc.iceConnectionState);pc.onicecandidate=e=>{if(!e.candidate)log("ICE gathering complete")};pc.ondatachannel=e=>setupDC(e.channel);pc.ontrack=e=>{if(e.track.kind!=="audio")return;log("REMOTE AUDIO TRACK RECEIVED");e.track.onunmute=()=>log("REMOTE AUDIO UNMUTED");e.track.onmute=()=>log("REMOTE AUDIO MUTED");remoteStream=e.streams&&e.streams[0]?e.streams[0]:remoteStream;if(!e.streams||!e.streams[0])remoteStream.addTrack(e.track);const a=$("remoteAudio");a.srcObject=remoteStream;a.muted=false;a.volume=1;$("playBtn").disabled=false;a.play().then(()=>log("Remote audio element playing")).catch(()=>log("Remote audio element deferred; press Play voice"))};return pc}
function handleCall(m){if(m.from===peer)return;if(m.type==="ring"){if(callActive){sendCall("busy");return}incoming=true;$("acceptBtn").disabled=false;$("declineBtn").disabled=false;$("voiceState").textContent="📞 Incoming call from "+m.from;$("incomingBox").textContent="📞 Incoming voice call — Accept or Decline";log("CALL RING received");startRing()}else if(m.type==="accept"){stopRing();$("voiceState").textContent="Live voice call";log("CALL ACCEPT received")}else if(m.type==="decline"){stopRing();hangup(false);$("voiceState").textContent="Call declined"}else if(m.type==="busy"){stopRing();hangup(false);$("voiceState").textContent="Peer is busy"}else if(m.type==="hangup"){stopRing();hangup(false);$("voiceState").textContent="Call ended by peer"}}
async function startCall(){unlockRemoteAudio();if(callActive)return;if(!pc||pc.connectionState!=="connected"){log("P2P connection not connected");return}try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const track=localStream.getAudioTracks()[0];await audioSender.replaceTrack(track);callActive=true;$("callBtn").disabled=true;$("muteBtn").disabled=false;$("hangupBtn").disabled=false;$("voiceState").textContent="📞 Calling — ringing peer";if(!sendCall("ring"))throw Error("DataChannel unavailable");log("LOCAL AUDIO TRACK ATTACHED; RING SENT")}catch(e){log("Start call error: "+e.message);if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}callActive=false}}
async function acceptCall(){unlockRemoteAudio();if(!incoming)return;stopRing();incoming=false;$("acceptBtn").disabled=true;$("declineBtn").disabled=true;$("incomingBox").textContent="";try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});await audioSender.replaceTrack(localStream.getAudioTracks()[0]);callActive=true;$("callBtn").disabled=true;$("muteBtn").disabled=false;$("hangupBtn").disabled=false;$("voiceState").textContent="Live voice call";sendCall("accept");log("LOCAL AUDIO TRACK ATTACHED; ACCEPT SENT")}catch(e){log("Accept error: "+e.message);sendCall("decline")}}function declineCall(){stopRing();incoming=false;$("acceptBtn").disabled=true;$("declineBtn").disabled=true;$("incomingBox").textContent="";sendCall("decline");$("voiceState").textContent="Call declined"}async function toggleMute(){if(!localStream)return;const t=localStream.getAudioTracks()[0];t.enabled=!t.enabled;$("muteBtn").textContent=t.enabled?"🔇 Mute":"🔊 Unmute";$("voiceState").textContent=t.enabled?"Live voice call":"Call muted"}async function hangup(notify=true){stopRing();if(notify)sendCall("hangup");if(audioSender)try{await audioSender.replaceTrack(null)}catch(e){}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}callActive=false;incoming=false;$("callBtn").disabled=false;$("muteBtn").disabled=true;$("hangupBtn").disabled=true;$("acceptBtn").disabled=true;$("declineBtn").disabled=true;$("incomingBox").textContent="";$("voiceState").textContent="Call idle";$("muteBtn").textContent="🔇 Mute"}async function playRemote(){try{const a=$("remoteAudio");a.muted=false;a.volume=1;await a.play();$("playBtn").textContent="🔊 Voice playing";log("Remote audio playback OK")}catch(e){log("Playback blocked: "+e.message)}}
function startPolling(){stopPolling();poller=setInterval(pollSignals,1800);pollSignals()}function stopPolling(){if(poller){clearInterval(poller);poller=null;log("Google Sheet polling stopped — P2P connected")}}async function pollSignals(){if(!pc||pc.connectionState==="connected")return;try{const rows=await getSignals();for(const x of rows){const k=x.timestamp+"|"+x.peer+"|"+x.type;if(seen.has(k)||x.peer===peer)continue;seen.add(k);if(role==="host"&&norm(x.type)==="answer"&&!pc.currentRemoteDescription){await pc.setRemoteDescription(JSON.parse(x.payload));log("REMOTE ANSWER APPLIED")}}}catch(e){log("Polling error: "+e.message)}}async function waitICE(){if(pc.iceGatheringState==="complete")return;await new Promise(resolve=>{const timer=setTimeout(resolve,12000),h=()=>{if(pc.iceGatheringState==="complete"){clearTimeout(timer);pc.removeEventListener("icegatheringstatechange",h);resolve()}};pc.addEventListener("icegatheringstatechange",h)})}async function host(){unlockRemoteAudio();if(!room())return alert("Enter a room code");role="host";seen=new Set();createPC();setupDC(pc.createDataChannel("chat"));await pc.setLocalDescription(await pc.createOffer());await waitICE();await publish("offer",JSON.stringify(pc.localDescription));setState("waiting-answer");startPolling()}async function join(){unlockRemoteAudio();if(!room())return alert("Enter a room code");role="guest";const rows=await getSignals(),offers=rows.filter(x=>norm(x.type)==="offer"&&x.peer!==peer);if(!offers.length){log("No offer found for room");return}createPC();await pc.setRemoteDescription(JSON.parse(offers[offers.length-1].payload));await pc.setLocalDescription(await pc.createAnswer());await waitICE();await publish("answer",JSON.stringify(pc.localDescription));setState("waiting-connect");startPolling()}function disconnect(){stopPolling();hangup(false);try{dc?.close()}catch(e){}try{pc?.close()}catch(e){}pc=null;dc=null;audioSender=null;setState("disconnected")}window.addEventListener("load",()=>{$("formUrl").value=FORM_URL;$('csvUrl').value=CSV_URL;$('peer').textContent=peer;$('remoteAudio').srcObject=remoteStream});
</script></body></html>
