<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC P2P Voice Call</title><style>body{font-family:system-ui;background:#0a1017;color:#eef3f8;margin:0}main{max-width:900px;margin:auto;padding:16px}.card{background:#111a24;border:1px solid #2b3a4b;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:6px;flex-wrap:wrap}input{padding:10px;border-radius:10px;border:1px solid #36495b;background:#0c141d;color:#eef3f8;width:100%;box-sizing:border-box}button{padding:10px 14px;margin:4px 2px;border-radius:10px;border:1px solid #405369;background:#13202d;color:#eef3f8;cursor:pointer}.pill{padding:5px 9px;border-radius:20px;background:#1e2b39;font-size:12px}.muted,.small{color:#9eacba;font-size:12px}.log{height:220px;overflow:auto;background:#080d13;border:1px solid #263543;border-radius:10px;padding:10px;white-space:pre-wrap}.incoming{border:1px solid #5a7b9c;border-radius:10px;padding:10px}</style></head><body><main><div class="card"><h1>WebRTC P2P Voice Call</h1><div class="muted">Pure peer-to-peer WebRTC audio. Google Form/Sheet is used only for initial SDP/ICE signaling.</div></div><div class="card"><label>Room</label><input id="room" placeholder="e.g. Home"><div class="small" style="margin-top:8px">Peer: <span class="pill" id="peer"></span> · State: <span class="pill" id="state">idle</span></div></div><div class="card"><div class="row"><button onclick="host()">Create / Host</button><button onclick="join()">Join</button><button onclick="disconnect()">Disconnect</button></div></div><div class="card"><h2>Realtime voice</h2><div class="row"><button id="callBtn" onclick="startCall()">📞 Start call</button><button id="acceptBtn" onclick="acceptCall()" disabled>✅ Accept</button><button id="declineBtn" onclick="declineCall()" disabled>❌ Decline</button><button id="muteBtn" onclick="toggleMute()" disabled>🔇 Mute</button><button id="hangupBtn" onclick="hangup()" disabled>☎ Hang up</button><button id="playBtn" onclick="enableRemoteAudio()" disabled>🔊 Enable voice</button></div><div id="voiceState" class="muted">Call idle</div><div id="incomingBox"></div><audio id="remoteAudio" autoplay playsinline preload="auto"></audio></div><div class="card"><h2>WebRTC / ICE</h2><pre id="log" class="log"></pre></div></main><script>
const FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSdEjjnrVdk-FNCTWiZ7nDaPGYdFgg9-7vINoMqoY5ynVA7twA/formResponse",CSV_URL="https://docs.google.com/spreadsheets/d/1Ldcjo11fSlrXcGe6FIPB606tCwc7_eTilWEe08J59Dc/export?format=csv",ENTRY={room:"entry.2110898792",peer:"entry.1013260375",type:"entry.1722712182",payload:"entry.1320930057"},ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]},peer=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()).slice(0,8);
let pc=null,dc=null,role="",poller=null,seen=new Set(),localStream=null,remoteStream=null,audioSender=null,callActive=false,incoming=false,ringTimer=null,retryTimer=null,retryCount=0,connectionGeneration=0,audioUnlocked=false,remoteAudioTrack=null,disconnecting=false;
const $=id=>document.getElementById(id),roomName=()=>$("room").value.trim();
function log(s){$("log").textContent+=new Date().toLocaleTimeString()+" "+s+"\n";$("log").scrollTop=$("log").scrollHeight}function setState(s){$("state").textContent=s}function setVoice(s){$("voiceState").textContent=s}
function setControls(connected){$("callBtn").disabled=!connected||callActive;$("muteBtn").disabled=!callActive;$("hangupBtn").disabled=!callActive;$("playBtn").disabled=!remoteAudioTrack||audioUnlocked}
function stopRing(){if(ringTimer){clearInterval(ringTimer);ringTimer=null}}
function startRing(){stopRing();try{const C=window.AudioContext||window.webkitAudioContext;if(!window.__ringCtx)window.__ringCtx=new C;const c=window.__ringCtx;if(c.state==='suspended')c.resume().catch(()=>{});const beep=()=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.18)};beep();ringTimer=setInterval(beep,900)}catch(e){log("Ring unavailable")}}
async function unlockRemoteAudio(){const a=$("remoteAudio");a.autoplay=true;a.playsInline=true;a.volume=1;try{a.muted=true;const p=a.play();if(p)await p.catch(()=>{});a.muted=false;audioUnlocked=true;$("playBtn").disabled=true;log("Remote audio playback primed")}catch(e){a.muted=false;audioUnlocked=false;$("playBtn").disabled=!!(!remoteAudioTrack)}}
async function enableRemoteAudio(){const a=$("remoteAudio");a.muted=false;a.volume=1;try{await a.play();audioUnlocked=true;$("playBtn").disabled=true;log("Remote audio playback enabled")}catch(e){log("Remote audio playback blocked: "+e.message)}}
function resetIncoming(){incoming=false;$("acceptBtn").disabled=true;$("declineBtn").disabled=true;$("incomingBox").textContent="";stopRing()}
function stopPolling(){if(poller){clearInterval(poller);poller=null}}
function sigKey(x){return [x.timestamp||"",x.peer||"",x.type||"",x.payload||""].join("|")}
function markSeen(rows){for(const x of rows)seen.add(sigKey(x))}
async function submit(type,payload){return new Promise(done=>{const n="gf"+Date.now()+Math.random(),i=document.createElement("iframe"),f=document.createElement("form");i.name=n;i.hidden=true;document.body.appendChild(i);f.action=FORM_URL;f.method="POST";f.target=n;[[ENTRY.room,roomName()],[ENTRY.peer,peer],[ENTRY.type,type],[ENTRY.payload,payload]].forEach(([k,v])=>{const x=document.createElement("input");x.name=k;x.value=v;f.appendChild(x)});document.body.appendChild(f);let finished=false,finish=()=>{if(finished)return;finished=true;setTimeout(()=>{f.remove();i.remove()},300);done()};i.onload=finish;f.submit();setTimeout(finish,1500)})}
async function publish(type,payload){await submit(type,payload);log("Published "+type)}
function parseCSV(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){const x=t[i],n=t[i+1];if(q){if(x==='"'&&n==='"'){c+='"';i++}else if(x==='"')q=false;else c+=x}else if(x==='"')q=true;else if(x===','){r.push(c);c=""}else if(x==='\n'){r.push(c);a.push(r);r=[];c=""}else if(x!=='\r')c+=x}if(c||r.length){r.push(c);a.push(r)}return a}
function norm(x){return String(x||"").trim().toLowerCase()}function col(h,n){for(const x of n){const i=h.indexOf(norm(x));if(i>=0)return i}return-1}
async function getSignals(){const z=await fetch(CSV_URL+"&t="+Date.now(),{cache:"no-store"});if(!z.ok)throw Error("Sheet HTTP "+z.status);const rows=parseCSV(await z.text()),h=(rows.shift()||[]).map(norm),ri=col(h,["room"]),pi=col(h,["peer"]),ti=col(h,["type"]),xi=col(h,["payload","payLoad"]);if([ri,pi,ti,xi].some(x=>x<0))throw Error("Sheet columns not found");return rows.filter(r=>norm(r[ri])===norm(roomName())).map(r=>({peer:r[pi]||"",type:r[ti]||"",payload:r[xi]||"",timestamp:r[0]||""}))}
async function prepareLocalAudio(){if(localStream?.active&&localStream.getAudioTracks().length)return localStream.getAudioTracks()[0];try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const t=localStream.getAudioTracks()[0];if(!t)throw Error("No microphone track");t.enabled=true;log("LOCAL AUDIO READY");return t}catch(e){log("Microphone permission/error: "+e.message);throw e}}
function closePC(){stopPolling();clearTimeout(retryTimer);retryTimer=null;try{dc?.close()}catch(e){}try{pc?.close()}catch(e){}dc=null;pc=null;audioSender=null;remoteAudioTrack=null;remoteStream=null}
function createPC(){closePC();const generation=++connectionGeneration;pc=new RTCPeerConnection(ICE);pc.onconnectionstatechange=()=>{if(generation!==connectionGeneration)return;const s=pc.connectionState;setState(s);log("Connection: "+s);if(s==='connected'){retryCount=0;clearTimeout(retryTimer);retryTimer=null;setVoice(callActive?"Live voice call":"Connected");setControls(true)}else if((s==='disconnected'||s==='failed')&&!disconnecting){setControls(false);if(callActive)setVoice("Reconnecting voice…");scheduleRecovery(generation)}};pc.oniceconnectionstatechange=()=>{if(generation===connectionGeneration)log("ICE: "+pc.iceConnectionState)};pc.onicegatheringstatechange=()=>{if(generation===connectionGeneration)log("ICE gathering: "+pc.iceGatheringState)};pc.onicecandidate=e=>{if(!e.candidate&&generation===connectionGeneration)log("ICE gathering complete")};pc.ondatachannel=e=>setupDC(e.channel);pc.ontrack=e=>{if(generation!==connectionGeneration||e.track.kind!=="audio")return;remoteAudioTrack=e.track;remoteStream=e.streams&&e.streams[0]?e.streams[0]:new MediaStream([e.track]);const a=$("remoteAudio");a.srcObject=remoteStream;a.autoplay=true;a.playsInline=true;a.muted=false;a.volume=1;$("playBtn").disabled=false;log("REMOTE AUDIO TRACK RECEIVED");e.track.onunmute=()=>{log("REMOTE AUDIO UNMUTED");if(audioUnlocked)a.play().catch(()=>{})};e.track.onended=()=>log("REMOTE AUDIO ENDED");a.play().then(()=>{audioUnlocked=true;$("playBtn").disabled=true;log("Remote audio playing")}).catch(()=>log("Remote audio requires Enable voice"))};return pc}
function setupDC(c){dc=c;c.onopen=()=>{log("DataChannel OPEN");setState("connected");setControls(true)};c.onclose=()=>log("DataChannel CLOSED");c.onerror=()=>log("DataChannel ERROR");c.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.kind==='call')handleCall(m)}catch(err){log("Call message parse error")}}}
function sendCall(type){if(!dc||dc.readyState!=="open"){log("DataChannel not open");return false}try{dc.send(JSON.stringify({kind:"call",type,from:peer,time:Date.now(),room:roomName()}));return true}catch(e){log("Call message error: "+e.message);return false}}
function handleCall(m){if(m.from===peer||norm(m.room)!==norm(roomName()))return;if(m.type==='ring'){if(callActive){sendCall('busy');return}incoming=true;$("acceptBtn").disabled=false;$("declineBtn").disabled=false;setVoice("📞 Incoming voice call");$("incomingBox").textContent="📞 Incoming call — Accept or Decline";startRing()}else if(m.type==='accept'){stopRing();setVoice("Live voice call")}else if(m.type==='decline'){stopRing();hangup(false);setVoice("Call declined")}else if(m.type==='busy'){stopRing();hangup(false);setVoice("Peer is busy")}else if(m.type==='hangup'){stopRing();hangup(false);setVoice("Call ended by peer")}}
async function startCall(){await unlockRemoteAudio();if(callActive)return;if(!pc||pc.connectionState!=="connected"){log("P2P connection not connected");return}callActive=true;setControls(true);setVoice("📞 Calling — ringing peer");if(!sendCall('ring')){callActive=false;setControls(true);return}log("CALL RING SENT")}
async function acceptCall(){await unlockRemoteAudio();if(!incoming)return;resetIncoming();callActive=true;setControls(true);setVoice("Live voice call");if(!sendCall('accept')){callActive=false;return}log("CALL ACCEPT SENT")}
function declineCall(){resetIncoming();sendCall('decline');setVoice("Call declined")}
function toggleMute(){if(!localStream)return;const t=localStream.getAudioTracks()[0];t.enabled=!t.enabled;$("muteBtn").textContent=t.enabled?"🔇 Mute":"🔊 Unmute";setVoice(t.enabled?"Live voice call":"Call muted")}
async function hangup(notify=true){stopRing();if(notify)sendCall('hangup');if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}callActive=false;incoming=false;if(audioSender)try{await audioSender.replaceTrack(null)}catch(e){}$("callBtn").disabled=!(pc&&pc.connectionState==='connected');$("muteBtn").disabled=true;$("hangupBtn").disabled=true;$("acceptBtn").disabled=true;$("declineBtn").disabled=true;$("incomingBox").textContent="";$("voiceState").textContent="Call idle";$("muteBtn").textContent="🔇 Mute"}
async function host(){disconnecting=false;role='host';retryCount=0;seen=new Set();stopPolling();clearTimeout(retryTimer);retryTimer=null;try{await unlockRemoteAudio();const mic=await prepareLocalAudio();const rows=await getSignals();markSeen(rows);createPC();audioSender=pc.addTrack(mic,[localStream]);log("LOCAL AUDIO ATTACHED BEFORE OFFER");const dcLocal=pc.createDataChannel('chat');setupDC(dcLocal);await pc.setLocalDescription(await pc.createOffer());await waitICE();await publish('offer',JSON.stringify(pc.localDescription));setState('waiting-answer');startPolling()}catch(e){log("HOST ERROR: "+e.message);setState('error')}}
async function join(){disconnecting=false;role='guest';retryCount=0;seen=new Set();stopPolling();clearTimeout(retryTimer);retryTimer=null;try{await unlockRemoteAudio();const rows=await getSignals();const offers=rows.filter(x=>norm(x.type)==='offer'&&x.peer!==peer);if(!offers.length){log("No offer found for room");return}const offerRow=offers[offers.length-1];markSeen(rows);const mic=await prepareLocalAudio();createPC();await pc.setRemoteDescription(JSON.parse(offerRow.payload));audioSender=pc.addTrack(mic,[localStream]);log("LOCAL AUDIO ATTACHED BEFORE ANSWER");await pc.setLocalDescription(await pc.createAnswer());await waitICE();await publish('answer',JSON.stringify(pc.localDescription));setState('waiting-connect');startPolling();log("JOIN OFFER APPLIED")}catch(e){log("JOIN ERROR: "+e.message);setState('error')}}
async function pollSignals(){if(!pc||disconnecting)return;if(pc.connectionState==='connected')return;try{const rows=await getSignals();for(const x of rows){const k=sigKey(x);if(seen.has(k)||x.peer===peer)continue;seen.add(k);if(role==='host'&&norm(x.type)==='answer'&&pc.signalingState==='have-local-offer'&&!pc.currentRemoteDescription){try{await pc.setRemoteDescription(JSON.parse(x.payload));log("REMOTE ANSWER APPLIED")}catch(e){log("ANSWER REJECTED: "+e.message)}}}}catch(e){log("Polling error: "+e.message)}}
async function waitICE(){if(!pc||pc.iceGatheringState==='complete')return;await new Promise(resolve=>{const timer=setTimeout(resolve,12000),h=()=>{if(!pc||pc.iceGatheringState==='complete'){clearTimeout(timer);pc?.removeEventListener('icegatheringstatechange',h);resolve()}};pc.addEventListener('icegatheringstatechange',h)})}
async function recoverConnection(){if(!role||!roomName()||retryCount>=2||disconnecting)return;retryCount++;const delay=700*retryCount;clearTimeout(retryTimer);retryTimer=setTimeout(async()=>{retryTimer=null;try{if(callActive)setVoice("Reconnecting voice…");if(role==='host'){const mic=localStream?.getAudioTracks?.()[0];if(!mic)return;const rows=await getSignals();markSeen(rows);createPC();audioSender=pc.addTrack(mic,[localStream]);setupDC(pc.createDataChannel('chat'));await pc.setLocalDescription(await pc.createOffer());await waitICE();await publish('offer',JSON.stringify(pc.localDescription));setState('waiting-answer');startPolling()}else{await join()}}catch(e){log("Recovery error: "+e.message);scheduleRecovery(connectionGeneration)}},delay)}
function scheduleRecovery(gen){if(gen!==connectionGeneration||retryTimer||retryCount>=2||disconnecting)return;recoverConnection()}
async function disconnect(){disconnecting=true;await hangup(false);stopPolling();clearTimeout(retryTimer);retryTimer=null;retryCount=99;closePC();if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}retryCount=0;disconnecting=false;setState('disconnected');setVoice('Disconnected');setControls(false)}
window.addEventListener('load',()=>{$("peer").textContent=peer;setControls(false);log("Pure P2P WebRTC — stable voice lifecycle")});
</script></body></html>
