<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveKit P2P Voice Call</title><script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.1/dist/livekit-client.umd.min.js"></script><style>body{font-family:system-ui;background:#0a1017;color:#eef3f8;margin:0}main{max-width:900px;margin:auto;padding:16px}.card{background:#111a24;border:1px solid #2b3a4b;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:6px;flex-wrap:wrap}input{padding:10px;border-radius:10px;border:1px solid #36495b;background:#0c141d;color:#eef3f8;width:100%;box-sizing:border-box}button{padding:10px 14px;margin:4px 2px;border-radius:10px;border:1px solid #405369;background:#13202d;color:#eef3f8;cursor:pointer}.pill{padding:5px 9px;border-radius:20px;background:#1e2b39;font-size:12px}.muted,.small{color:#9eacba;font-size:12px}.log{height:220px;overflow:auto;background:#080d13;border:1px solid #263543;border-radius:10px;padding:10px;white-space:pre-wrap}.incoming{border:1px solid #5a7b9c;border-radius:10px;padding:10px;margin-top:8px}.hidden{display:none}</style></head><body><main><div class="card"><h1>LiveKit Voice Call</h1><div class="muted">LiveKit handles room connection, WebRTC media, reconnection and remote audio. Google Form/Sheet signaling is no longer used.</div></div><div class="card"><label>Room</label><input id="room" placeholder="e.g. Home"><div class="small" style="margin-top:8px">Peer: <span class="pill" id="peer"></span> · State: <span class="pill" id="state">idle</span></div></div><div class="card"><div class="row"><button onclick="host()">Create / Host</button><button onclick="join()">Join</button><button onclick="disconnect()">Disconnect</button></div></div><div class="card"><h2>Realtime voice</h2><div class="row"><button id="callBtn" onclick="startCall()">📞 Start call</button><button id="acceptBtn" onclick="acceptCall()" disabled>✅ Accept</button><button id="declineBtn" onclick="declineCall()" disabled>❌ Decline</button><button id="muteBtn" onclick="toggleMute()" disabled>🔇 Mute</button><button id="hangupBtn" onclick="hangup()" disabled>☎ Hang up</button><button id="playBtn" onclick="enableAudio()" disabled>🔊 Enable voice</button></div><div id="voiceState" class="muted">Call idle</div><div id="incomingBox"></div><div id="audioMount"></div></div><div class="card"><h2>LiveKit</h2><pre id="log" class="log"></pre></div></main><script>
const LIVEKIT_TOKEN_SERVER_ID="YOUR_TOKEN_SERVER_ID";
const peer=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()).slice(0,8);
const {Room,RoomEvent,Track,TokenSource,LogLevel}=LivekitClient;
let roomObj=null,role="",localTrack=null,callActive=false,incoming=false,ringTimer=null,audioReady=false;
const $=id=>document.getElementById(id),roomName=()=>$("room").value.trim();
function log(s){$("log").textContent+=new Date().toLocaleTimeString()+" "+s+"\n";$("log").scrollTop=$("log").scrollHeight}
function state(s){$("state").textContent=s}
function controls(active){$("callBtn").disabled=!active||callActive;$("muteBtn").disabled=!callActive;$("hangupBtn").disabled=!callActive}
function stopRing(){if(ringTimer){clearInterval(ringTimer);ringTimer=null}}
function startRing(){stopRing();try{const C=window.AudioContext||window.webkitAudioContext,c=window.__ringCtx||(window.__ringCtx=new C);const beep=()=>{if(c.state==='suspended')c.resume().catch(()=>{});const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2)};beep();ringTimer=setInterval(beep,900)}catch(e){}}
async function enableAudio(){if(!roomObj)return;try{await roomObj.startAudio();audioReady=true;$("playBtn").disabled=true;log("Remote audio enabled") }catch(e){log("Audio enable failed: "+e.message)}}
function resetIncoming(){incoming=false;$("acceptBtn").disabled=true;$("declineBtn").disabled=true;$("incomingBox").textContent="";stopRing()}
function setupRoom(r){roomObj=r;r.setLogLevel(LogLevel.warn);r.on(RoomEvent.TrackSubscribed,(track,publication,participant)=>{if(track.kind!==Track.Kind.Audio)return;const el=track.attach();el.autoplay=true;el.playsInline=true;el.volume=1;$("audioMount").appendChild(el);$("playBtn").disabled=!r.canPlaybackAudio;log("Remote audio subscribed: "+participant.identity);if(r.canPlaybackAudio)el.play().catch(()=>$("playBtn").disabled=false)});r.on(RoomEvent.TrackUnsubscribed,(track)=>track.detach());r.on(RoomEvent.ParticipantConnected,p=>log("Participant joined: "+p.identity));r.on(RoomEvent.ParticipantDisconnected,p=>{log("Participant left: "+p.identity);if(callActive)hangup(false)});r.on(RoomEvent.Reconnecting,()=>{state("reconnecting");log("LiveKit reconnecting")});r.on(RoomEvent.Reconnected,()=>{state("connected");log("LiveKit reconnected")});r.on(RoomEvent.Disconnected,reason=>{state("disconnected");log("LiveKit disconnected: "+reason);controls(false);resetIncoming()});r.on(RoomEvent.AudioPlaybackStatusChanged,()=>{$("playBtn").disabled=r.canPlaybackAudio});r.on(RoomEvent.DataReceived,(payload,participant,kind,topic)=>{try{const m=JSON.parse(new TextDecoder().decode(payload));if(m.kind==='call')handleCall(m)}catch(e){}});return r}
async function connectRoom(){if(roomObj&&roomObj.state!=="disconnected")return true;if(!roomName()){alert("Enter a room name");return false}if(!LIVEKIT_TOKEN_SERVER_ID||LIVEKIT_TOKEN_SERVER_ID.includes("YOUR_")){log("Configure LIVEKIT_TOKEN_SERVER_ID first");alert("Set LIVEKIT_TOKEN_SERVER_ID in WebRTC_V.html");return false}try{const ts=TokenSource.developmentTokenServer(LIVEKIT_TOKEN_SERVER_ID);const creds=await ts.fetch({roomName:roomName()});const r=setupRoom(new Room({adaptiveStream:false,dynacast:false}));await r.connect(creds.serverUrl,creds.participantToken,{autoSubscribe:true});state("connected");log("Connected to LiveKit room: "+r.name);controls(true);return true}catch(e){state("error");log("LiveKit connection error: "+e.message);return false}}
async function host(){role="host";await connectRoom()}
async function join(){role="guest";await connectRoom()}
async function sendCall(type){if(!roomObj||!roomObj.localParticipant)return;const data=new TextEncoder().encode(JSON.stringify({kind:"call",type,from:peer,time:Date.now()}));await roomObj.localParticipant.publishData(data,{reliable:true,topic:"voice-call"})}
function handleCall(m){if(m.from===peer)return;if(m.type==='ring'){if(callActive){sendCall('busy');return}incoming=true;$("acceptBtn").disabled=false;$("declineBtn").disabled=false;$("voiceState").textContent="📞 Incoming voice call";$("incomingBox").textContent="📞 Incoming call — Accept or Decline";startRing()}else if(m.type==='accept'){stopRing();$("voiceState").textContent="Live voice call"}else if(m.type==='decline'||m.type==='busy'){hangup(false);$("voiceState").textContent=m.type==='busy'?"Peer is busy":"Call declined"}else if(m.type==='hangup'){hangup(false);$("voiceState").textContent="Call ended by peer"}}
async function publishMic(){if(localTrack)return true;try{localTrack=await LivekitClient.createLocalAudioTrack({echoCancellation:true,noiseSuppression:true,autoGainControl:true});await roomObj.localParticipant.publishTrack(localTrack,{source:Track.Source.Microphone,name:"microphone"});return true}catch(e){log("Microphone error: "+e.message);return false}}
async function startCall(){if(callActive||!roomObj)return;if(!audioReady)await enableAudio();if(!(await publishMic()))return;callActive=true;$("voiceState").textContent="📞 Calling — ringing peer";controls(true);await sendCall("ring")}
async function acceptCall(){if(!incoming)return;resetIncoming();if(!audioReady)await enableAudio();if(!(await publishMic())){await sendCall("decline");return}callActive=true;$("voiceState").textContent="Live voice call";controls(true);await sendCall("accept")}
async function declineCall(){resetIncoming();if(roomObj)await sendCall("decline");$("voiceState").textContent="Call declined"}
function toggleMute(){if(!localTrack)return;localTrack.isMuted?localTrack.unmute():localTrack.mute();$("muteBtn").textContent=localTrack.isMuted?"🔊 Unmute":"🔇 Mute";$("voiceState").textContent=localTrack.isMuted?"Call muted":"Live voice call"}
async function hangup(notify=true){stopRing();if(notify&&roomObj)try{await sendCall("hangup")}catch(e){}if(localTrack){try{await roomObj.localParticipant.unpublishTrack(localTrack.mediaStreamTrack)}catch(e){}localTrack.stop();localTrack=null}callActive=false;resetIncoming();$("voiceState").textContent="Call idle";$("muteBtn").textContent="🔇 Mute";controls(!!roomObj&&roomObj.state==='connected')}
async function disconnect(){await hangup(false);if(roomObj){await roomObj.disconnect();roomObj=null}state("disconnected");controls(false);log("Disconnected")}
window.addEventListener("load",()=>{$("peer").textContent=peer;controls(false);log("LiveKit SDK v2.22.1 loaded")});
</script></body></html>
