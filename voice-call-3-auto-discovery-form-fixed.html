<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC Voice Call - Google Form POST Fixed</title></head><body><div id="status" style="font-family:system-ui;padding:20px">Loading fixed signaling transport…</div><script>
(async()=>{try{const src='voice-call-3-auto-discovery.html?__formfix='+Date.now();const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw Error('Base page HTTP '+r.status);let h=await r.text();const old='async function submit(type,payload){const rm=room();if(!rm)throw Error("No room code created before Form submission");const fd=new FormData;fd.append(ENTRY.room,rm);fd.append(ENTRY.peer,peer);fd.append(ENTRY.type,type);fd.append(ENTRY.payload,payload);log("Submitting "+type+" to Google Form for new host room "+rm);try{await fetch(FORM_URL,{method:"POST",mode:"no-cors",body:fd,cache:"no-store",keepalive:true});log("Google Form request dispatched: "+type+" / "+rm)}catch(e){log("Publish request error: "+e.message);throw e}}async function publish(t,p){return submit(t,p)}';const fixed='async function submit(type,payload){const rm=room();if(!rm)throw Error("No room code created before Form submission");return new Promise(done=>{const n="gf"+Date.now()+Math.random().toString(36).slice(2),i=document.createElement("iframe"),f=document.createElement("form");i.name=n;i.hidden=true;i.style.display="none";document.body.appendChild(i);f.action=FORM_URL;f.method="POST";f.target=n;[[ENTRY.room,rm],[ENTRY.peer,peer],[ENTRY.type,type],[ENTRY.payload,payload]].forEach(([k,v])=>{const x=document.createElement("input");x.type="hidden";x.name=k;x.value=String(v);f.appendChild(x)});document.body.appendChild(f);let finished=false;const finish=()=>{if(finished)return;finished=true;log("Google Form native POST submitted: "+type+" / "+rm);setTimeout(()=>{f.remove();i.remove()},500);done()};i.onload=finish;f.submit();setTimeout(finish,1800)})}async function publish(t,p){return submit(t,p)}';if(!h.includes(old))throw Error('Target submit function not found');h=h.replace(old,fixed);document.open();document.write(h);document.close()}catch(e){document.getElementById('status').textContent='Fix loader failed: '+e.message}})();
</script></body></html>
