<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC Voice Call - Google Form POST Fixed</title></head><body><div id="status" style="font-family:system-ui;padding:20px">Loading fixed signaling transport…</div><script>
(async()=>{try{const src='voice-call-3-auto-discovery.html?__formfix='+Date.now();const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw Error('Base page HTTP '+r.status);let h=await r.text();const old='async function submit(type,payload){const rm=room();if(!rm)throw Error("No room code created before Form submission");const fd=new FormData;fd.append(ENTRY.room,rm);fd.append(ENTRY.peer,peer);fd.append(ENTRY.type,type);fd.append(ENTRY.payload,payload);log("Submitting "+type+" to Google Form for new host room "+rm);try{await fetch(FORM_URL,{method:"POST",mode:"no-cors",body:fd,cache:"no-store",keepalive:true});log("Google Form request dispatched: "+type+" / "+rm)}catch(e){log("Publish request error: "+e.message);throw e}}async function publish(t,p){return submit(t,p)}';const fixed='function submitToGoogleForm(type,payload){return new Promise(resolve=>{const frameName="gf_"+Date.now()+"_"+Math.random().toString(36).slice(2);const iframe=document.createElement("iframe");iframe.name=frameName;iframe.style.display="none";document.body.appendChild(iframe);const form=document.createElement("form");form.action=FORM_URL;form.method="POST";form.target=frameName;form.style.display="none";[[ENTRY.room,room()],[ENTRY.peer,peer],[ENTRY.type,type],[ENTRY.payload,payload]].forEach(([name,value])=>{const i=document.createElement("input");i.name=name;i.value=value;form.appendChild(i)});document.body.appendChild(form);let done=false;const finish=()=>{if(done)return;done=true;log("Google Form submission completed: "+type+" / "+room());setTimeout(()=>{form.remove();iframe.remove()},500);resolve()};iframe.onload=finish;form.submit();setTimeout(()=>{if(done)return;done=true;log("Google Form submission timeout: "+type+" / "+room());setTimeout(()=>{form.remove();iframe.remove()},500);resolve()},1800)})}async function submit(type,payload){return submitToGoogleForm(type,payload)}async function publish(t,p){await submitToGoogleForm(t,p);log("Published "+t+" via Google Form")}' ;if(!h.includes(old))throw Error('Target submit function not found');h=h.replace(old,fixed);document.open();document.write(h);document.close()}catch(e){document.getElementById('status').textContent='Fix loader failed: '+e.message}})();
</script></body></html>
